name: Build, test, and publish

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Tavily.slnx

      - name: Build
        run: dotnet build Tavily.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Tavily.slnx --configuration Release --no-build

  publish:
    name: Publish NuGet package
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install nbgv CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/nbgv" nbgv --version 3.10.94

      - name: Calculate package version
        id: version
        shell: bash
        run: echo "package-version=$($RUNNER_TEMP/nbgv/nbgv get-version -v NuGetPackageVersion)" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore src/Tavily.csproj

      - name: Pack
        run: dotnet pack src/Tavily.csproj --configuration Release --no-restore --output artifacts -p:PackageVersion="${{ steps.version.outputs.package-version }}"

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
